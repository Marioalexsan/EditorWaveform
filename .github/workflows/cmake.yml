name: Build packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            target: MacOS
            configure-args: -DBUILD_TESTING=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - platform: Windows
            os: windows-latest
            target: Win64
            configure-args: -DBUILD_TESTING=OFF
    steps:
      - uses: actions/checkout@v4
      - name: Audio and timing tests
        run: |
          cmake -S . -B build/tests -DEDITOR_WAVEFORM_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tests --config Debug --parallel
          ctest --test-dir build/tests -C Debug --output-on-failure
      - name: Build ${{ matrix.platform }} Geode package
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          cli: latest
          target: ${{ matrix.target }}
          bindings-ref: f8aec5d1f3df76d840dfd2609f02cef30dc6efdf
          build-config: RelWithDebInfo
          configure-args: ${{ matrix.configure-args }}
      - name: Upload ${{ matrix.platform }} package
        uses: actions/upload-artifact@v4
        with:
          name: EditorWaveform-${{ matrix.platform }}
          path: build/*.geode
          if-no-files-found: error
